<!DOCTYPE html>
<html>
<head>
    <title>Bank Cards - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/app.js"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen py-10">

<div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
    <div class="text-center mb-8">
        <h2 class="text-3xl font-bold text-blue-600">Bank UI</h2>
        <p class="text-gray-500 mt-2">Create your account</p>
    </div>

    <form id="registerForm" class="space-y-5">
        <div>
            <label class="block text-sm font-medium text-gray-700">First Name</label>
            <input type="text" id="name" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 placeholder-gray-400" placeholder="John">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Last Name</label>
            <input type="text" id="surname" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 placeholder-gray-400" placeholder="Doe">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Email Address</label>
            <input type="email" id="email" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 placeholder-gray-400" placeholder="john.doe@example.com">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Password</label>
            <input type="password" id="password" required minlength="6" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 placeholder-gray-400" placeholder="Min. 6 characters">
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white py-2 mt-4 rounded-lg hover:bg-blue-700 transition font-semibold">
            Register & Login
        </button>
    </form>

    <p class="text-center text-sm text-gray-600 mt-6">
        Already have an account? <a href="/login" class="text-blue-600 hover:underline font-medium">Sign in</a>
    </p>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const name = document.getElementById('name').value;
        const surname = document.getElementById('surname').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('/api/user/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, surname, email, password })
            });

            if (response.ok) {
                const text = await response.text();
                let data = {};

                if (text) {
                    try {
                        data = JSON.parse(text);
                    } catch (err) {
                        console.log("Backend returned plain text:", text);
                    }
                }

                if (data.accessToken && typeof setToken === 'function') {
                    setToken(data.accessToken);
                    alert('Registration successful! Redirecting to dashboard...');
                    window.location.href = '/user/dashboard';
                } else {
                    alert('Registration successful! Please log in with your new account.');
                    window.location.href = '/login';
                }
            } else {
                const errorText = await response.text();
                alert('Registration failed: ' + errorText);
            }
        } catch (err) {
            alert('Error occurred: ' + err.message);
            console.error(err);
        }
    });
</script>
</body>
</html>
