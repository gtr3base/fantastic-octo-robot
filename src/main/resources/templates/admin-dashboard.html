<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BankCards Admin | Modern Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f8;
            color: #1e293b;
            line-height: 1.5;
        }

        /* modern scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 10px;
        }

        /* layout */
        .dashboard-container {
            display: flex;
            min-height: 100vh;
        }

        /* ========= SIDEBAR ========= */
        .sidebar {
            width: 280px;
            background: linear-gradient(145deg, #0f172a 0%, #111827 100%);
            color: #e2e8f0;
            backdrop-filter: blur(2px);
            transition: all 0.3s ease;
            box-shadow: 4px 0 24px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .logo-area {
            padding: 32px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 24px;
        }
        .logo-area h2 {
            font-weight: 700;
            font-size: 1.7rem;
            background: linear-gradient(135deg, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }
        .logo-area p {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 6px;
        }

        .nav-menu {
            flex: 1;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: 16px;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            color: #cbd5e1;
        }
        .nav-item i {
            width: 24px;
            font-size: 1.2rem;
        }
        .nav-item.active {
            background: rgba(96, 165, 250, 0.18);
            color: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            border-left: 3px solid #60a5fa;
        }
        .nav-item:hover:not(.active) {
            background: rgba(255,255,255,0.05);
            color: #f1f5f9;
        }

        /* main content */
        .main-content {
            flex: 1;
            overflow-x: auto;
            padding: 28px 32px;
        }

        /* header stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: white;
            border-radius: 28px;
            padding: 20px 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.02), 0 2px 4px rgba(0,0,0,0.02);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(203,213,225,0.5);
        }
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 30px -12px rgba(0,0,0,0.08);
        }
        .stat-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 10px;
        }
        .stat-value {
            font-size: 2.4rem;
            font-weight: 800;
            color: #0f172a;
        }

        /* action bar */
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 28px 0 20px 0;
            flex-wrap: wrap;
            gap: 12px;
        }
        .btn {
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
            border: 1px solid #cbd5e1;
            color: #1e293b;
        }
        .btn-primary {
            background: #3b82f6;
            border: none;
            color: white;
            box-shadow: 0 4px 8px rgba(59,130,246,0.2);
        }
        .btn-primary:hover {
            background: #2563eb;
            transform: scale(1.02);
        }
        .btn-danger {
            background: #ef4444;
            color: white;
            border: none;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .btn-outline {
            border: 1px solid #cbd5e1;
            background: white;
        }

        /* tables modern */
        .data-table {
            width: 100%;
            background: white;
            border-radius: 28px;
            border-collapse: collapse;
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(0,0,0,0.02);
            margin-top: 12px;
        }
        .data-table th {
            text-align: left;
            padding: 18px 20px;
            background: #f8fafc;
            font-weight: 600;
            font-size: 0.85rem;
            color: #475569;
            border-bottom: 1px solid #e2e8f0;
        }
        .data-table td {
            padding: 16px 20px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.9rem;
            vertical-align: middle;
        }
        .data-table tr:hover td {
            background-color: #fefce8;
        }
        .badge {
            background: #e2e8f0;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .badge-admin {
            background: #8b5cf6;
            color: white;
        }
        .badge-user {
            background: #10b981;
            color: white;
        }
        .action-icons i {
            margin: 0 6px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.1s;
        }
        .fa-trash-alt { color: #ef4444; }
        .fa-edit { color: #3b82f6; }
        .fa-check-circle { color: #10b981; }
        .fa-eye { color: #64748b; }

        /* modal modern */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(3px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }
        .modal-container {
            background: white;
            width: 500px;
            max-width: 90%;
            border-radius: 36px;
            padding: 28px 32px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.2);
        }
        .modal-container h3 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 20px;
            border: 1px solid #cbd5e1;
            font-family: 'Inter', sans-serif;
            transition: 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59,130,246,0.2);
        }
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        @media (max-width: 780px) {
            .sidebar { width: 90px; }
            .sidebar .logo-area p, .sidebar .nav-item span:not(i) { display: none; }
            .sidebar .nav-item { justify-content: center; }
            .main-content { padding: 20px; }
        }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .loading-spinner { text-align: center; padding: 40px; }
    </style>
</head>
<body>
<div class="dashboard-container">

    <aside class="sidebar">
        <div class="logo-area">
            <h2><i class="fas fa-credit-card"></i> Bank<span style="color:#60a5fa;">Cards</span></h2>
            <p>Admin console · secure access</p>
        </div>
        <div class="nav-menu">
            <div class="nav-item active" data-tab="users">
                <i class="fas fa-users"></i> <span>Users</span>
            </div>
            <div class="nav-item" data-tab="cards">
                <i class="fas fa-credit-card"></i> <span>Cards</span>
            </div>
            <div class="nav-item" data-tab="analytics">
                <i class="fas fa-chart-line"></i> <span>Analytics</span>
            </div>
        </div>
        <div style="padding: 24px; border-top: 1px solid rgba(255,255,255,0.05); margin-top: auto; font-size: 12px; color:#64748b;">
            <i class="fas fa-shield-alt"></i> Admin API v1
        </div>
    </aside>


    <main class="main-content">

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><div class="stat-title">Total Users</div><div class="stat-value" id="totalUsers">-</div></div>
            <div class="stat-card"><div class="stat-title">Total Cards</div><div class="stat-value" id="totalCards">-</div></div>
            <div class="stat-card"><div class="stat-title">Active Cards</div><div class="stat-value" id="activeCards">-</div></div>
        </div>


        <div id="dynamicPanel"></div>
    </main>
</div>


<div id="genericModal" class="modal-overlay">
    <div class="modal-container">
        <h3 id="modalTitle">Modal Title</h3>
        <form id="modalForm">
            <div id="modalFields"></div>
            <div class="modal-buttons">
                <button type="button" class="btn" id="closeModalBtn">Cancel</button>
                <button type="submit" class="btn btn-primary" id="modalSubmitBtn">Save</button>
            </div>
        </form>
    </div>
</div>

<script>

    let currentTab = 'users';
    let usersList = [];
    let cardsList =[];


    async function apiFetch(url, options = {}) {
        const token = localStorage.getItem('accessToken');
        const headers = {
            'Content-Type': 'application/json',
            ...(token && { 'Authorization': `Bearer ${token}` }),
            ...options.headers
        };

        const response = await fetch(url, { ...options, headers: headers });

        if (response.status === 401 || response.status === 403) {
            alert("Unauthorized! You must be logged in as an ADMIN.");
            window.location.href = '/login';
            throw new Error(`API error ${response.status}: Unauthorized`);
        }

        if (!response.ok && response.status !== 204) {
            const errorText = await response.text();
            throw new Error(`API error ${response.status}: ${errorText}`);
        }

        if (response.status === 204) return null;

        const text = await response.text();
        return text ? JSON.parse(text) : null;
    }


    async function loadUsers() {
        try {
            usersList = await apiFetch('/api/admin/users');
            return usersList;
        } catch(e) { console.error(e); showToast("Failed loading users", true); return[]; }
    }
    async function loadCards() {
        try {
            cardsList = await apiFetch('/api/admin/cards');
            return cardsList;
        } catch(e) { console.error(e); showToast("Failed loading cards", true); return[]; }
    }
    async function refreshStats() {
        const users = await loadUsers();
        const cards = await loadCards();
        document.getElementById('totalUsers').innerText = users.length;
        document.getElementById('totalCards').innerText = cards.length;
        document.getElementById('activeCards').innerText = cards.length;
    }


    function renderUsers() {
        const html = `
            <div class="action-bar">
                <h2 style="font-weight:700;"><i class="fas fa-users"></i> Manage Users</h2>
            </div>
            <table class="data-table">
                <thead>
                    <tr><th>ID</th><th>Full Name</th><th>Email</th><th>Role</th><th>Created</th><th>Actions</th></tr>
                </thead>
                <tbody>
                    ${usersList.map(user => `
                        <tr>
                            <td>${user.id}</td>
                            <td>${escapeHtml(user.name)} ${escapeHtml(user.surname)}</td>
                            <td>${escapeHtml(user.email)}</td>
                            <td><span class="badge ${user.role === 'ADMIN' ? 'badge-admin' : 'badge-user'}">${user.role}</span></td>
                            <td>${user.createdAt ? new Date(user.createdAt).toLocaleString('en-US', {
                                year: 'numeric',
                                month: 'short',
                                day: 'numeric',
                                hour: '2-digit',
                                minute: '2-digit'
                            }) : '-'}</td>
                                <td class="action-icons">
                                <i class="fas fa-edit" title="Edit User Role" data-id="${user.id}" data-action="editUser"></i>
                                <i class="fas fa-trash-alt" title="Delete" data-id="${user.id}" data-action="deleteUser"></i>
                                <i class="fas fa-credit-card" title="View Cards" data-id="${user.id}" data-action="viewUserCards"></i>
                            </td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
        document.getElementById('dynamicPanel').innerHTML = html;
        attachUserActions();
    }

    function attachUserActions() {
        document.querySelectorAll('.fa-edit').forEach(el => el.addEventListener('click', (e) => {
            const userId = parseInt(el.dataset.id);
            openEditUserModal(userId);
        }));
        document.querySelectorAll('.fa-trash-alt').forEach(el => el.addEventListener('click', async (e) => {
            const userId = parseInt(el.dataset.id);
            if(confirm("Delete user permanently? All related cards likely removed.")) {
                await apiFetch(`/api/admin/users/${userId}`, { method: 'DELETE' });
                showToast("User deleted");
                await refreshStats();
                await loadUsers();
                renderCurrentTab();
            }
        }));
        document.querySelectorAll('.fa-credit-card').forEach(el => el.addEventListener('click', (e) => {
            const userId = parseInt(el.dataset.id);
            viewUserCardsModal(userId);
        }));
    }

    async function renderCards() {
        const cards = await loadCards();
        const html = `
        <div class="action-bar">
            <h2><i class="fas fa-credit-card"></i> Bank Cards Management</h2>
            <button class="btn btn-primary" id="createCardBtn"><i class="fas fa-plus"></i> Issue New Card</button>
        </div>
        <table class="data-table">
            <thead>
                <tr><th>Masked Number</th><th>Owner</th><th>Expiration</th><th>Balance (€)</th><th>Actions</th></tr>
            </thead>
            <tbody>
                ${cards.map(card => `
                    <tr>
                        <td>${escapeHtml(card.cardNumber || '****')}</td>
                        <td>${escapeHtml(card.owner)}</td>
                        <td>${escapeHtml(card.expirationDate)}</td>
                        <td>${card.balance != null ? card.balance.toFixed(2) : '0.00'} €</td>
                        <td class="action-icons">
                            <i class="fas fa-check-circle" style="color:#10b981;" title="Activate Card" data-id="${card.id}" data-action="activateCard"></i>
                            <i class="fas fa-trash-alt" title="Delete Card" data-id="${card.id}" data-action="deleteCard"></i>
                        </td>
                    </tr>
                `).join('')}
            </tbody>
        </table>
    `;
        document.getElementById('dynamicPanel').innerHTML = html;
        document.getElementById('createCardBtn')?.addEventListener('click', () => openCreateCardModal());

        document.querySelectorAll('[data-action="activateCard"]').forEach(el => el.addEventListener('click', async (e) => {
            const cardId = parseInt(el.dataset.id);
            if(confirm("Activate this card?")) {
                await apiFetch(`/api/admin/cards/${cardId}/activate`, { method: 'PATCH' });
                showToast("Card activated");
                await refreshStats(); await renderCards();
            }
        }));
        document.querySelectorAll('[data-action="deleteCard"]').forEach(el => el.addEventListener('click', async (e) => {
            const cardId = parseInt(el.dataset.id);
            const cardBalance = parseFloat(el.closest('tr').querySelector('td:nth-child(4)').textContent.replace('€', '').trim());

            // Check if card has positive balance before attempting deletion
            if (cardBalance > 0) {
                showToast("Cannot delete card with positive balance. Please withdraw funds first.", true);
                return;
            }

            if(confirm("Delete this card?")) {
                try {
                    const response = await fetch(`/api/admin/cards/${cardId}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${localStorage.getItem('accessToken')}`,
                            'Content-Type': 'application/json'
                        }
                    });

                    if (!response.ok) {
                        const errorText = await response.text();
                        let errorMessage = `Failed to delete card (${response.status})`;
                        try {
                            const errorJson = JSON.parse(errorText);
                            errorMessage = errorJson.message || errorJson.error || errorText;
                        } catch {
                            errorMessage = errorText || errorMessage;
                        }
                        throw new Error(errorMessage);
                    }

                    showToast("Card deleted successfully");
                    await refreshStats();
                    await renderCards();
                } catch(err) {
                    console.error('Delete error:', err);
                    showToast(err.message || "Failed to delete card", true);
                }
            }
        }));
    }


    async function renderAnalytics() {
        const cards = await loadCards();
        const ownerCount = {};
        cards.forEach(card => { ownerCount[card.owner] = (ownerCount[card.owner] || 0) + 1; });
        const labels = Object.keys(ownerCount).slice(0,6);
        const dataPoints = labels.map(l => ownerCount[l]);
        const html = `
            <div style="background:white; border-radius: 32px; padding: 24px; margin-top: 12px;">
                <h3><i class="fas fa-chart-pie"></i> Cards distribution per owner</h3>
                <canvas id="cardsChart" style="max-height: 380px; width:100%; margin-top: 20px;"></canvas>
                <p class="mt-3" style="margin-top:24px; color:#475569;"><i class="fas fa-info-circle"></i> Total unique card owners: ${Object.keys(ownerCount).length}</p>
            </div>
        `;
        document.getElementById('dynamicPanel').innerHTML = html;
        const ctx = document.getElementById('cardsChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: { labels, datasets:[{ label: 'Number of Cards', data: dataPoints, backgroundColor: '#818cf8', borderRadius: 10 }] },
            options: { responsive: true, maintainAspectRatio: true }
        });
    }


    async function openEditUserModal(userId) {
        const user = usersList.find(u => u.id === userId);
        if(!user) return;
        document.getElementById('modalTitle').innerText = "Edit User";
        document.getElementById('modalFields').innerHTML = `
            <div class="form-group"><label>Name</label><input type="text" id="name" value="${escapeHtml(user.name)}" required></div>
            <div class="form-group"><label>Surname</label><input type="text" id="surname" value="${escapeHtml(user.surname)}" required></div>
            <div class="form-group"><label>Email</label><input type="email" id="email" value="${escapeHtml(user.email)}" required></div>
            <div class="form-group"><label>Role</label><select id="role"><option ${user.role === 'USER'?'selected':''}>USER</option><option ${user.role === 'ADMIN'?'selected':''}>ADMIN</option></select></div>
        `;
        const modal = document.getElementById('genericModal');
        modal.classList.add('active');
        document.getElementById('modalForm').onsubmit = async (e) => {
            e.preventDefault();
            const updatePayload = {
                name: document.getElementById('name').value,
                surname: document.getElementById('surname').value,
                email: document.getElementById('email').value,
                role: document.getElementById('role').value,
            };
            try {
                await apiFetch(`/api/admin/users/${userId}`, { method: 'PUT', body: JSON.stringify(updatePayload) });
                showToast("User updated");
                modal.classList.remove('active');
                await refreshStats(); await loadUsers(); renderCurrentTab();
            } catch(err) { showToast("Update error", true); }
        };
    }


    function openCreateCardModal() {
        document.getElementById('modalTitle').innerText = "Issue New Card";
        document.getElementById('modalFields').innerHTML = `
            <div class="form-group"><label>Card Number (Format: xxxx xxxx xxxx xxxx)</label><input type="text" id="cardNumber" placeholder="4111 1111 1111 1111" required></div>
            <div class="form-group"><label>Owner Email (e.g. admin@admin.com)</label><input type="email" id="ownerEmail" placeholder="user@example.com" required></div>
            <div class="form-group"><label>Expiration Date (MM/YY)</label><input type="text" id="expirationDate" placeholder="12/28" required></div>
            <div class="form-group"><label>Balance (cents, e.g., 5000 => 50.00€)</label><input type="number" id="balance" value="0" required></div>
        `;
        const modal = document.getElementById('genericModal');
        modal.classList.add('active');
        document.getElementById('modalForm').onsubmit = async (e) => {
            e.preventDefault();


            let formattedCardNumber = document.getElementById('cardNumber').value.trim();
            if (/^\d{16}$/.test(formattedCardNumber.replace(/\s+/g, ''))) {
                formattedCardNumber = formattedCardNumber.replace(/\s+/g, '').replace(/(\d{4})(?=\d)/g, '$1 ');
            }

            const cardPayload = {
                cardNumber: formattedCardNumber,
                ownerEmail: document.getElementById('ownerEmail').value,
                expirationDate: document.getElementById('expirationDate').value,
                balance: parseInt(document.getElementById('balance').value) || 0,
            };

            try {
                await apiFetch('/api/admin/cards', { method: 'POST', body: JSON.stringify(cardPayload) });
                showToast("Card created successfully!");
                modal.classList.remove('active');
                await refreshStats();
                if(currentTab === 'cards') await renderCards(); else if(currentTab==='users') renderCurrentTab();
            } catch(err) {
                showToast("Failed to create card. Check data.", true);
                console.error(err);
            }
        };
    }

    async function viewUserCardsModal(userId) {
        try {
            const userCards = await apiFetch(`/api/admin/users/${userId}/cards`);
            if(!userCards.length) { alert("No cards for this user."); return; }
            let msg = "Cards:\n";
            userCards.forEach(c => msg += `${c.cardNumber} | ${c.owner} | Exp:${c.expirationDate} | Bal:${c.balance}€\n`);
            alert(msg);
        } catch(e) { alert("Could not fetch cards"); }
    }


    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
    function showToast(msg, isError=false) {
        let toast = document.createElement('div');
        toast.innerText = msg;
        toast.style.position = 'fixed'; toast.style.bottom = '20px'; toast.style.right = '20px';
        toast.style.backgroundColor = isError ? '#ef4444' : '#10b981';
        toast.style.color = 'white'; toast.style.padding = '12px 20px'; toast.style.borderRadius = '40px';
        toast.style.fontWeight = '500'; toast.style.zIndex = '9999'; toast.style.boxShadow = '0 4px 12px rgba(0,0,0,0.1)';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2800);
    }

    function renderCurrentTab() {
        if(currentTab === 'users') renderUsers();
        else if(currentTab === 'cards') renderCards();
        else if(currentTab === 'analytics') renderAnalytics();
    }

    async function init() {
        await refreshStats();
        renderCurrentTab();

        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', (e) => {
                document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                item.classList.add('active');
                currentTab = item.dataset.tab;
                renderCurrentTab();
            });
        });
        document.getElementById('closeModalBtn')?.addEventListener('click', () => document.getElementById('genericModal').classList.remove('active'));
        window.addEventListener('click', (e) => { if(e.target === document.getElementById('genericModal')) document.getElementById('genericModal').classList.remove('active'); });
    }
    init();
</script>
</body>
</html>
