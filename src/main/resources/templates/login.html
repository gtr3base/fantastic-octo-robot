<!DOCTYPE html>
<html>
<head>
  <title>Bank Cards - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen">

<div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
  <div class="text-center mb-8">
    <h2 class="text-3xl font-bold text-blue-600">Bank UI</h2>
    <p class="text-gray-500 mt-2">Sign in to your account</p>
  </div>

  <form id="loginForm" class="space-y-6">
    <div>
      <label class="block text-sm font-medium text-gray-700">Email</label>
      <input type="email" id="email" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700">Password</label>
      <input type="password" id="password" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
    </div>
    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition font-semibold">Sign In</button>
  </form>

  <p class="text-center text-sm text-gray-600 mt-4">
    Don't have an account? <a href="/register" class="text-blue-600 hover:underline">Register</a>
  </p>
  <p class="text-center text-sm text-gray-600 mt-2">
    Are you an Admin? <a href="/admin/dashboard" class="text-red-600 hover:underline">Admin Panel</a>
  </p>
</div>

<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    const submitBtn = e.target.querySelector('button[type="submit"]');
    const originalText = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in...';

    try {
      console.log('Sending login request for:', email);

      const response = await fetch('/api/user/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ email, password })
      });

      console.log('Response status:', response.status);

      if (response.ok) {
        const data = await response.json();
        console.log('Response data:', data);


        const accessToken = data.accessToken || data.loginToken;
        const refreshToken = data.refreshToken;

        if (accessToken) {
          localStorage.setItem('accessToken', accessToken);
          console.log('Token stored successfully');
        }

        if (refreshToken) {
          localStorage.setItem('refreshToken', refreshToken);
        }


        if (email === 'admin@admin.com' || email.includes('admin')) {
          window.location.href = '/admin/dashboard';
        } else {
          window.location.href = '/user/dashboard';
        }
      } else {
        const errorText = await response.text();
        console.error('Login failed:', errorText);
        alert('Login failed: ' + (errorText || 'Invalid email or password'));
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
      }
    } catch (error) {
      console.error('Error details:', error);
      alert('Connection error: ' + error.message);
      submitBtn.disabled = false;
      submitBtn.textContent = originalText;
    }
  });
</script>
</body>
</html>
